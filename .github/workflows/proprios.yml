name: Propriétaires personnes morales
on:
  schedule:
    - cron: "37 3 * * 1" # chaque lundi : fichier annuel de la DGFiP (personnes morales), départements de data-config.json
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: proprios, cancel-in-progress: false }
jobs:
  proprios:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Propriétaires personnes morales (DGFiP)
        run: python -u tools/build_proprios.py --config data-config.json --out out
      - name: Copropriétés immatriculées (registre national, ANAH)
        continue-on-error: true
        run: python -u tools/build_copros.py --config data-config.json --out out/copros
      - name: Publication sur la branche proprios
        run: |
          cd out
          git init -q -b proprios
          git config user.name "fonciscope-bot"
          git config user.email "fonciscope-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Propriétaires personnes morales du $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" proprios
  publier:
    needs: proprios
    uses: ./.github/workflows/pages.yml
